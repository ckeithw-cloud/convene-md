<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#0f2942"/>
  <g transform="translate(64,56) scale(0.85)">
    <path d="M 64 6 C 38 6, 18 24, 18 50 C 18 92, 64 124, 64 124 C 64 124, 110 92, 110 50 C 110 24, 90 6, 64 6 Z" fill="#36b3a8"/>
    <line x1="26" y1="50" x2="102" y2="50" stroke="white" stroke-width="1.6" opacity="0.55"/>
    <path d="M 64 10 Q 34 50 64 90" fill="none" stroke="white" stroke-width="1.6" opacity="0.55"/>
    <rect x="57" y="24" width="14" height="42" fill="white" rx="2"/>
    <rect x="43" y="38" width="42" height="14" fill="white" rx="2"/>
  </g>
  <text x="180" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">convene.md</text>
  <text x="70" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#E0A33E" letter-spacing="3">THE ONE THAT CATCHES PEOPLE OUT</text>
  <text x="70" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" fill="#FFFFFF">It is not 31</text>
  <text x="70" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" fill="#FFFFFF">December.</text>
  <text x="70" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#FFFFFF" opacity="0.9">Your reimbursement submission deadline</text>
  <text x="70" y="702" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#FFFFFF" opacity="0.9">is often weeks earlier than the expiry.</text>
  <rect x="70" y="780" width="4" height="170" fill="#E0A33E"/>
  <text x="104" y="832" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF" opacity="0.75">Also worth confirming:</text>
  <text x="104" y="884" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF">• whether travel and lodging are covered</text>
  <text x="104" y="932" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF">• whether pre-approval is required first</text>
  <text x="1010" y="1016" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#36b3a8" text-anchor="end">5 / 6</text>
</svg>
