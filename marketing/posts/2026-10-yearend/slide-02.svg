  <text x="180" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#0f2942">convene.md</text>
  <text x="70" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#36b3a8" letter-spacing="3">FIRST, ASK YOUR ADMINISTRATOR</text>
  <text x="70" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#0f2942">Does my allowance</text>
  <text x="70" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#0f2942">pay out on the date</text>
  <text x="70" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#0f2942">I register and pay,</text>
  <text x="70" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#9C6A14">or the date the</text>
  <text x="70" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#9C6A14">conference happens?</text>
  <rect y="840" width="1080" height="240" fill="#0f2942"/>
  <text x="70" y="912" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#FFFFFF">That single answer decides everything</text>
  <text x="70" y="964" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#FFFFFF">below. Ask it in writing.</text>
